[project]
name = "sdk-support-hero"
version = "0.1.0"
description = "Local support-hero kanban with read-only GitHub and PostHog sync"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dustin Byrne" }]
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9", "PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/dustinbyrne/sdk-hero"
Issues = "https://github.com/dustinbyrne/sdk-hero/issues"

[project.scripts]
sdk-hero = "sdk_support_hero.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
